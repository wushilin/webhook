name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  cancel-duplicate-release-runs:
    name: Cancel older runs for this tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "release.yml",
              per_page: 100,
            });
            for (const run of data.workflow_runs) {
              if (run.id !== context.runId &&
                  run.head_branch === context.ref_name &&
                  ["queued", "in_progress"].includes(run.status)) {
                core.info(`Cancelling superseded run ${run.id}`);
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
              }
            }

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: cancel-duplicate-release-runs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo build --locked --release --target "$TARGET"
          mkdir -p staging
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/webhook.exe" staging/
          else
            cp "target/$TARGET/release/webhook" staging/
          fi
          cp README.md config.example.toml LICENSE staging/
          tar -czf "webhook-$RELEASE_TAG-$TARGET.tar.gz" -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: webhook-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-freebsd:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    needs: cancel-duplicate-release-runs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-freebsd
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build and package in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          copyback: true
          run: |
            pkg install -y rust
            cargo build --locked --release --target ${{ matrix.target }}
            mkdir -p staging
            cp target/${{ matrix.target }}/release/webhook staging/
            cp README.md config.example.toml LICENSE staging/
            tar -czf webhook-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: webhook-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-freebsd-aarch64:
    name: Build aarch64-unknown-freebsd
    runs-on: ubuntu-24.04
    needs: cancel-duplicate-release-runs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-freebsd

      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-freebsd@14

      - name: Build and package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo build --locked --release --target aarch64-unknown-freebsd
          mkdir -p staging
          cp target/aarch64-unknown-freebsd/release/webhook staging/
          cp README.md config.example.toml LICENSE staging/
          tar -czf "webhook-$RELEASE_TAG-aarch64-unknown-freebsd.tar.gz" -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-unknown-freebsd
          path: webhook-${{ github.ref_name }}-aarch64-unknown-freebsd.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-linux-musl:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    needs: cancel-duplicate-release-runs
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cross build --locked --release --target "$TARGET"
          mkdir -p staging
          cp "target/$TARGET/release/webhook" staging/
          cp README.md config.example.toml LICENSE staging/
          tar -czf "webhook-$RELEASE_TAG-$TARGET.tar.gz" -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: webhook-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build, build-freebsd, build-freebsd-aarch64, build-linux-musl]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.tar.gz
